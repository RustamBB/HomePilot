AWSTemplateFormatVersion: "2010-09-09"
Description: HomePilot AI demo - DynamoDB state + App Runner service (MCP server + API in one container) with Bedrock access
Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (build with the repo Dockerfile and push first)
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  AgentMode:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, offline]
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: household_id, AttributeType: S}]
      KeySchema: [{AttributeName: household_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: build.apprunner.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: tasks.apprunner.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: homepilot
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: "*"
  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: homepilot-demo
      SourceConfiguration:
        AuthenticationConfiguration: {AccessRoleArn: !GetAtt EcrAccessRole.Arn}
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              - {Name: HOMEPILOT_DDB_TABLE, Value: !Ref StateTable}
              - {Name: HOMEPILOT_AGENT, Value: !Ref AgentMode}
              - {Name: HOMEPILOT_MODEL_ID, Value: !Ref ModelId}
              - {Name: AWS_REGION, Value: !Ref "AWS::Region"}
      InstanceConfiguration: {Cpu: "1024", Memory: "2048", InstanceRoleArn: !GetAtt InstanceRole.Arn}
      HealthCheckConfiguration: {Protocol: HTTP, Path: /api/health, Interval: 10, Timeout: 5}
Outputs:
  Url:
    Value: !Sub "https://${Service.ServiceUrl}"
  Table:
    Value: !Ref StateTable
