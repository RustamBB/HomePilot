[project]
name = "homepilot"
version = "0.1.0"
description = "HomePilot AI - household coordination agent (MCP + Strands + Bedrock)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
aws = ["strands-agents>=1.0", "boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["packages/domain", "services/mcp", "services/agent", "services/api"]
testpaths = ["tests"]
asyncio_mode = "auto"
